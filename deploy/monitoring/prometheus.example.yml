# Merge these sections into your application-owned Prometheus configuration.
# This file does not configure a notification receiver. See README.md.
global:
  scrape_interval: 30s
  evaluation_interval: 30s
rule_files:
  - image-reliability.rules.yml
scrape_configs:
  - job_name: librechat
    scheme: https
    metrics_path: /metrics
    scrape_timeout: 10s
    authorization:
      type: Bearer
      credentials_file: /run/secrets/librechat-metrics-token
    static_configs:
      - targets: ['jingjicang.zeabur.app']
