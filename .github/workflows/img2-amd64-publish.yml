name: Publish verified IMG2 AMD64 image

on:
  push:
    branches: [ci/img2-amd64-publish]
    paths: [.github/workflows/img2-amd64-publish.yml]

permissions:
  contents: read
  packages: write

concurrency:
  group: img2-amd64-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'wen26223/LibreChat-main' && github.ref == 'refs/heads/ci/img2-amd64-publish'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SOURCE_COMMIT: 2e96d65ce2cc4fc593677c2f810f0ea188ca4fe7
      SOURCE_TREE: df11aecb22a13d2554a1aa3c61fa05c8f41e73a0
      LOCAL_IMAGE: img2-verified:amd64
    steps:
      - name: Require existing private GHCR package before building
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api "users/$GITHUB_REPOSITORY_OWNER/packages/container/librechat-dev" > "$RUNNER_TEMP/package-visibility.json"
          jq -e '.visibility == "private" and .package_type == "container" and .name == "librechat-dev"' "$RUNNER_TEMP/package-visibility.json" >/dev/null

      - uses: actions/checkout@v4
        with:
          ref: 2e96d65ce2cc4fc593677c2f810f0ea188ca4fe7
          persist-credentials: false

      - name: Verify source and define unique release tag
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          printf 'IMAGE_TAG=img2-%s-%s-%s\n' "$SOURCE_COMMIT" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          printf 'BUILD_DATE=%s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
          git ls-files -z api packages client/src | grep -zE '\.(js|jsx|ts|tsx)$' | xargs -0 sha256sum > "$RUNNER_TEMP/source-hashes.txt"

      - uses: docker/setup-buildx-action@v3

      - name: Build native AMD64 candidate without publishing
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          target: node
          platforms: linux/amd64
          push: false
          load: true
          tags: img2-verified:amd64
          build-args: |
            BUILD_COMMIT=${{ env.SOURCE_COMMIT }}
            BUILD_BRANCH=main
            BUILD_DATE=${{ env.BUILD_DATE }}

      - name: Verify actual image before publishing
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker image inspect --format '{{.Architecture}}' "$LOCAL_IMAGE")" = amd64
          docker run --rm --network none --cap-drop ALL \
            --mount "type=bind,src=$RUNNER_TEMP/source-hashes.txt,dst=/source-hashes.txt,readonly" \
            --entrypoint /bin/sh "$LOCAL_IMAGE" -c 'cd /app && sha256sum -c /source-hashes.txt >/dev/null'
          docker run --rm --network none --cap-drop ALL -e LOG_TO_FILE=false \
            -e EXPECTED_COMMIT="$SOURCE_COMMIT" --entrypoint node "$LOCAL_IMAGE" -e '
            const assert = require("node:assert/strict");
            const fs = require("node:fs");
            assert.equal(process.env.BUILD_COMMIT, process.env.EXPECTED_COMMIT);
            assert.equal(process.env.LD_PRELOAD, "/usr/lib/libjemalloc.so.2");
            assert.equal(process.arch, "x64");
            assert(fs.readFileSync("/app/client/dist/index.html", "utf8").includes("<html"));
            const methods = require("/app/packages/data-schemas/dist/methods/imageProviderConcurrencyLease.cjs")
              .createImageProviderConcurrencyLeaseMethods({models:{ImageProviderConcurrencyLease:{}}});
            assert.equal(typeof methods.listActiveImageProviderConcurrencyLeases, "function");
            assert.equal(typeof require("/app/packages/api/dist/index.js").uploadFalImages, "function");
            require("sharp")({create:{width:2,height:2,channels:3,background:"white"}}).png().toBuffer()
              .then(b => { assert(b.length > 0); console.log("Native image verification passed"); process.exit(0); })
              .catch(e => { console.error(e.message); process.exit(1); });'

      - name: Authenticate to existing GHCR destination
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish unique tag to verified private destination
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api "users/$GITHUB_REPOSITORY_OWNER/packages/container/librechat-dev" > "$RUNNER_TEMP/package-visibility.json"
          jq -e '.visibility == "private" and .package_type == "container" and .name == "librechat-dev"' "$RUNNER_TEMP/package-visibility.json" >/dev/null
          ghcr_image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/librechat-dev:$IMAGE_TAG"
          docker tag "$LOCAL_IMAGE" "$ghcr_image"
          docker push "$ghcr_image"
          docker image inspect "$LOCAL_IMAGE" --format '{{json .RepoDigests}}' > "$RUNNER_TEMP/image-digests.json"
          printf 'Verified AMD64 source: `%s`\nUnique tag: `%s`\n' "$SOURCE_COMMIT" "$IMAGE_TAG" >> "$GITHUB_STEP_SUMMARY"

      - name: Retain release evidence in this repository
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: img2-amd64-release-evidence
          retention-days: 30
          path: |
            ${{ runner.temp }}/source-hashes.txt
            ${{ runner.temp }}/image-digests.json
